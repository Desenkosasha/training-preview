(function () {
  var K = "efr_training_preview_pw";
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function dec(pw) {
    var te = new TextEncoder();
    return crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENV.salt), iterations: ENV.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

  function show(html) { document.open(); document.write(html); document.close(); }
  function gate() {
    if (window.top !== window) { document.getElementById("locked").hidden = false; return; }
    var f = document.getElementById("gate"); f.hidden = false; document.getElementById("pw").focus();
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var pw = document.getElementById("pw").value, err = document.getElementById("err"); err.textContent = "";

        .catch(function () { err.textContent = "Wrong password."; });
